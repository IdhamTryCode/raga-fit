<!DOCTYPE html><html class="dark" lang="id"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed-dim": "#6fd2ff", "surface-container-low": "#1a1c20", "primary-fixed": "#ffdbd1", "surface-bright": "#37393e", "surface-dim": "#111317", "on-background": "#e2e2e8", "error": "#ffb4ab", "surface-container-highest": "#333539", "secondary-fixed": "#64fe9f", "on-primary-container": "#571100", "on-primary": "#601300", "tertiary-fixed": "#c0e8ff", "on-error": "#690005", "secondary-fixed-dim": "#41e185", "surface-container": "#1e2024", "outline-variant": "#5b403a", "on-primary-fixed-variant": "#881f00", "primary-container": "#ff5a2c", "inverse-primary": "#b22c00", "surface-variant": "#333539", "on-surface": "#e2e2e8", "on-tertiary-fixed": "#001f2b", "on-secondary-fixed-variant": "#00522a", "tertiary": "#6fd2ff", "surface-tint": "#ffb5a1", "surface-container-lowest": "#0c0e12", "on-tertiary-fixed-variant": "#004d66", "inverse-surface": "#e2e2e8", "surface-container-high": "#282a2e", "inverse-on-surface": "#2f3035", "on-tertiary-container": "#002f40", "tertiary-container": "#009ecd", "on-secondary-fixed": "#00210d", "on-secondary": "#00391b", "on-surface-variant": "#e4beb5", "on-primary-fixed": "#3b0800", "secondary-container": "#00c16a", "primary": "#ffb5a1", "primary-fixed-dim": "#ffb5a1", "on-error-container": "#ffdad6", "background": "#111317", "error-container": "#93000a", "on-tertiary": "#003547", "secondary": "#41e185", "on-secondary-container": "#004824", "surface": "#111317", "outline": "#ab8981" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "space-xl": "1.5rem", "space-lg": "1rem", "gutter": "1rem", "margin": "1.25rem", "space-xs": "0.25rem", "space-md": "0.75rem" }, "fontFamily": { "label-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "stat-compact": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "stat-display": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"] }, "fontSize": { "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}], "label-md": ["13px", {"lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600"}], "stat-compact": ["24px", {"lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700"}], "headline-xl": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800"}], "stat-display": ["32px", {"lineHeight": "38px", "letterSpacing": "-0.03em", "fontWeight": "800"}], "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}], "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "600"}], "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}], "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}] } } } }</script></head><body class="bg-surface text-on-surface antialiased pt-safe pb-safe min-h-screen flex flex-col"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin"><div class="flex flex-col w-full max-w-md mx-auto justify-between pb-safe pt-4">
<div class="flex flex-col w-full">
<!-- Header: Brand Logo & Title -->
<header class="flex flex-col items-center text-center mt-4 mb-8">
<div class="w-16 h-16 rounded-2xl overflow-hidden bg-surface-container flex items-center justify-center p-1 shadow-sm mb-4">
<img alt="Raga Logo" class="w-full h-full object-cover rounded-xl" src="https://lh3.googleusercontent.com/aida/AEtjO1VL0_hT583ScNtPjh3A5bOYI5zU1hqh7ysIXInMfhf60w9gQ1SlG8D8O422cBwxCcdmIkkDVq-byHvrT-3KFNGR-YpX0Vop_UkbPvwRW_y79beKjbjqPdT_228ByQb3kfSBe06HokBNI4H4dv-Ib3SKUtSQwyajqtFYv5JXeOI0snRatZOEnjQ9LoYqgAxSUqzip8eg14tCSIXwtHjUxKM7E2OKPbRgNKGBjwKtmNT0ayPgJ1w6C09ZDIU">
</div>
<h1 class="font-headline-lg text-headline-lg text-white font-extrabold tracking-tight">Raga</h1>
<p class="font-body-md text-body-md text-outline mt-1 font-medium">Catat latihanmu, lihat progresmu.</p>
</header>
<!-- Form Section -->
<section class="flex flex-col w-full">
<!-- Segmented Toggle: Masuk | Daftar -->
<div class="w-full h-12 bg-surface-container-low p-1 rounded-2xl flex items-center mb-6">
<button class="flex-1 h-full rounded-xl flex items-center justify-center font-label-md text-label-md text-outline transition-all active:scale-[0.98]" type="button">
          Masuk
        </button>
<button class="flex-1 h-full rounded-xl bg-primary-container text-white flex items-center justify-center font-label-md text-label-md font-bold shadow-sm transition-all active:scale-[0.98]" type="button">
          Daftar
        </button>
</div>
<!-- Input Fields -->
<form class="flex flex-col gap-4 w-full" id="signupForm" onsubmit="event.preventDefault();">
<!-- Field Email -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-white font-semibold ml-0.5" for="email">Email</label>
<div class="relative w-full">
<input class="w-full h-13 px-4 py-3.5 bg-surface-container text-white placeholder:text-outline/70 font-body-md text-body-md rounded-2xl outline-none transition-all focus:bg-surface-container-high" id="email" name="email" placeholder="nama@email.com" type="email">
</div>
</div>
<!-- Field Password -->
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md text-white font-semibold ml-0.5" for="password">Password</label>
<div class="relative flex items-center w-full">
<input class="w-full h-13 pl-4 pr-12 py-3.5 bg-surface-container text-white placeholder:text-outline/70 font-body-md text-body-md rounded-2xl outline-none transition-all focus:bg-surface-container-high" id="password" name="password" placeholder="Minimal 8 karakter" type="password">
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 bottom-0 px-3.5 flex items-center justify-center text-outline hover:text-white transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
</form>
</section>
</div>
<!-- Bottom CTA Container -->
<div class="w-full pt-8 pb-4">
<button class="w-full bg-primary-container text-white font-label-md text-label-md font-bold rounded-2xl flex items-center justify-center transition-all active:scale-[0.98] shadow-sm hover:opacity-95 h-12" form="signupForm" type="submit">
      Daftar
    </button>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main>

</body></html>
