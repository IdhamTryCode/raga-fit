rse-on-surface": "#2f3035", "surface-bright": "#37393e", "surface-container-high": "#282a2e" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1.25rem", "space-xl": "1.5rem", "space-lg": "1rem", "space-md": "0.75rem", "gutter": "1rem", "space-sm": "0.5rem", "space-xs": "0.25rem" }, fontFamily: { "body-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "stat-compact": ["Plus Jakarta Sans"], "stat-display": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"] }, fontSize: { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "stat-compact": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "stat-display": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.03em", "fontWeight": "800" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }] } } } };</script><style>
    body {

  </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-container selection:text-white"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin"><div class="flex flex-col w-full pb-6 justify-between select-none">
<!-- Top Navigation & Stepper Header -->
<div class="flex items-center justify-between w-full h-12 mb-6">
<button aria-label="Kembali" class="w-12 h-12 flex items-center justify-center rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<!-- 3 Progress Dots Indicator -->
<div class="flex items-center space-x-2">
<div class="w-2.5 h-2.5 rounded-full bg-primary-container shadow-[0_0_8px_rgba(255,90,44,0.6)]"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Visual Balancer -->
<div class="w-12 h-12 pointer-events-none opacity-0"></div>
</div>
<!-- Header Text -->
<div class="flex flex-col mb-8">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-primary font-semibold mb-2">Langkah 1 dari 3</span>
<h1 class="font-stat-compact text-stat-compact text-on-surface leading-tight font-bold">
      Di mana kamu biasa latihan?
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">
      Pilih tempat favoritmu untuk menyesuaikan variasi gerakan yang tepat.
    </p>
</div>
<!-- Selectable Options Stack -->
<div class="flex flex-col space-y-4 mb-8" id="location-options">
<!-- Option 1: Rumah (Default Selected) -->
<button class="option-card group relative w-full p-5 rounded-2xl text-left transition-all duration-200 bg-surface-container active:scale-[0.99] flex items-center justify-between" data-val="rumah" type="button">
<div class="flex items-center space-x-4 min-w-0">
<div class="icon-box w-12 h-12 rounded-xl flex items-center justify-center shrink-0 bg-primary-container text-white transition-colors duration-200">
<span class="material-symbols-outlined text-[24px]">home</span>
</div>
<div class="flex flex-col min-w-0">
<span class="title-text font-body-lg text-body-lg font-bold text-on-surface">Rumah</span>
<span class="font-body-md text-body-md text-on-surface-variant truncate">dumbbell dan berat badan</span>
</div>
</div>
<div class="check-box w-6 h-6 rounded-full flex items-center justify-center shrink-0 bg-primary-container text-white ml-3 transition-all duration-200">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</button>
<!-- Option 2: Gym (Unselected) -->
<button class="option-card group relative w-full p-5 rounded-2xl text-left transition-all duration-200 bg-surface-container-low active:scale-[0.99] flex items-center justify-between" data-val="gym" type="button">
<div class="flex items-center space-x-4 min-w-0">
<div class="icon-box w-12 h-12 rounded-xl flex items-center justify-center shrink-0 bg-surface-container-high text-on-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined text-[24px]">fitness_center</span>
</div>
<div class="flex flex-col min-w-0">
<span class="title-text font-body-lg text-body-lg font-bold text-on-surface">Gym</span>
<span class="font-body-md text-body-md text-on-surface-variant truncate">alat lengkap</span>
</div>
</div>
<div class="check-box w-6 h-6 rounded-full flex items-center justify-center shrink-0 bg-surface-container-high text-transparent ml-3 transition-all duration-200">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</button>
<!-- Option 3: Keduanya (Unselected) -->
<button class="option-card group relative w-full p-5 rounded-2xl text-left transition-all duration-200 bg-surface-container-low active:scale-[0.99] flex items-center justify-between" data-val="keduanya" type="button">
<div class="flex items-center space-x-4 min-w-0">
<div class="icon-box w-12 h-12 rounded-xl flex items-center justify-center shrink-0 bg-surface-container-high text-on-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined text-[24px]">sync_alt</span>
</div>
<div class="flex flex-col min-w-0">
<span class="title-text font-body-lg text-body-lg font-bold text-on-surface">Keduanya</span>
<span class="font-body-md text-body-md text-on-surface-variant truncate">fleksibel sesuai jadwal</span>
</div>
</div>
<div class="check-box w-6 h-6 rounded-full flex items-center justify-center shrink-0 bg-surface-container-high text-transparent ml-3 transition-all duration-200">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</button>
</div>
<!-- Bottom CTA Container -->
<div class="w-full mt-auto pt-4">
<button class="w-full h-[52px] rounded-2xl bg-primary-container text-white font-label-md text-label-md font-bold flex items-center justify-center shadow-[0_8px_24px_rgba(255,90,44,0.25)] active:scale-[0.98] hover:opacity-95 transition-all duration-150" id="btn-next" type="button">
      Lanjut
    </button>
</div>
</div>
<script>
  (function() {
    const cards = document.querySelectorAll('.option-card');
    
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.classList.remove('bg-surface-container');
          c.classList.add('bg-surface-container-low');
          
          const icon = c.querySelector('.icon-box');
          icon.classList.remove('bg-primary-container', 'text-white');
          icon.classList.add('bg-surface-container-high', 'text-on-surface-variant');
          
          const check = c.querySelector('.check-box');
          check.classList.remove('bg-primary-container', 'text-white');
          check.classList.add('bg-surface-container-high', 'text-transparent');
        });
        
        card.classList.remove('bg-surface-container-low');
        card.classList.add('bg-surface-container');
        
        const activeIcon = card.querySelector('.icon-box');
        activeIcon.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
        activeIcon.classList.add('bg-primary-container', 'text-white');
        
        const activeCheck = card.querySelector('.check-box');
        activeCheck.classList.remove('bg-surface-container-high', 'text-transparent');
        activeCheck.classList.add('bg-primary-container', 'text-white');
      });
    });
  })();
</script></main></body></html>
