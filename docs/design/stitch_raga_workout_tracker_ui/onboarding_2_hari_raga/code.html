<!DOCTYPE html>

<html class="dark" lang="id"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;background-color:#111317;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-tint": "#ffb5a1", "surface-container-highest": "#333539", "on-background": "#e2e2e8", "primary-fixed": "#ffdbd1", "surface-container-lowest": "#0c0e12", "on-tertiary-fixed": "#001f2b", "on-error-container": "#ffdad6", "error": "#ffb4ab", "on-tertiary-container": "#002f40", "primary-container": "#ff5a2c", "secondary-fixed-dim": "#41e185", "tertiary-fixed": "#c0e8ff", "tertiary-fixed-dim": "#6fd2ff", "outline": "#ab8981", "on-surface-variant": "#e4beb5", "on-surface": "#e2e2e8", "on-secondary-container": "#004824", "error-container": "#93000a", "surface-dim": "#111317", "surface-variant": "#333539", "primary-fixed-dim": "#ffb5a1", "inverse-primary": "#b22c00", "on-primary-container": "#571100", "tertiary-container": "#009ecd", "on-tertiary": "#003547", "on-secondary-fixed": "#00210d", "secondary-fixed": "#64fe9f", "on-secondary-fixed-variant": "#00522a", "surface-container-low": "#1a1c20", "on-error": "#690005", "tertiary": "#6fd2ff", "background": "#111317", "inverse-surface": "#e2e2e8", "on-tertiary-fixed-variant": "#004d66", "outline-variant": "#5b403a", "on-primary": "#601300", "on-primary-fixed-variant": "#881f00", "on-primary-fixed": "#3b0800", "primary": "#ffb5a1", "secondary-container": "#00c16a", "surface": "#111317", "on-secondary": "#00391b", "secondary": "#41e185", "surface-container": "#1e2024", "inverse-on-surface": "#2f3035", "surface-bright": "#37393e", "surface-container-high": "#282a2e" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1.25rem", "space-xl": "1.5rem", "space-lg": "1rem", "space-md": "0.75rem", "gutter": "1rem", "space-sm": "0.5rem", "space-xs": "0.25rem" }, fontFamily: { "body-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "stat-compact": ["Plus Jakarta Sans"], "stat-display": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"] }, fontSize: { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "stat-compact": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "stat-display": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.03em", "fontWeight": "800" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-container selection:text-white"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin"><div class="flex flex-col w-full pb-safe">
<!-- Top Navigation & Progress Dots -->
<div class="flex items-center justify-between py-space-md mb-space-lg">
<button aria-label="Kembali" class="w-12 h-12 flex items-center justify-center rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex items-center space-x-2">
<span class="w-2.5 h-2.5 rounded-full bg-primary-container"></span>
<span class="w-2.5 h-2.5 rounded-full bg-primary-container"></span>
<span class="w-2.5 h-2.5 rounded-full bg-surface-container-highest"></span>
</div>
<div class="w-12 h-12"></div>
</div>
<!-- Main Question / Title -->
<div class="mb-space-xl">
<h1 class="font-headline-md text-headline-md text-on-surface">Berapa hari seminggu?</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Pilih frekuensi latihan yang paling cocok dengan rutinitasmu.</p>
</div>
<!-- Day Frequency Selection Cards -->
<div class="grid grid-cols-3 gap-space-sm mb-space-xl" id="frequency-selector">
<!-- Option 3 Hari -->
<button class="freq-btn flex flex-col items-center justify-center py-5 px-space-xs rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-95 transition-all" data-days="3" type="button">
<span class="font-stat-compact text-stat-compact text-on-surface leading-none">3</span>
<span class="font-label-md text-label-md text-on-surface-variant mt-1">hari</span>
</button>
<!-- Option 4 Hari (Selected default) -->
<button class="freq-btn relative flex flex-col items-center justify-center py-5 px-space-xs rounded-xl bg-primary-container text-white shadow-lg active:scale-95 transition-all" data-days="4" type="button">
<span class="font-stat-compact text-stat-compact text-white leading-none">4</span>
<span class="font-label-md text-label-md text-white mt-1">hari</span>
</button>
<!-- Option 5 Hari -->
<button class="freq-btn flex flex-col items-center justify-center py-5 px-space-xs rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-95 transition-all" data-days="5" type="button">
<span class="font-stat-compact text-stat-compact text-on-surface leading-none">5</span>
<span class="font-label-md text-label-md text-on-surface-variant mt-1">hari</span>
</button>
</div>
<!-- Weekday Distribution Card -->
<div class="bg-surface-container-low rounded-xl p-space-lg mb-space-xl">
<div class="flex items-center justify-between mb-space-md">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Jadwal Latihan Mingguan</span>
<span class="font-label-sm text-label-sm text-primary-container font-semibold" id="active-count-label">4 hari aktif</span>
</div>
<!-- 7 Weekday Chips -->
<div class="grid grid-cols-7 gap-1.5" id="weekday-chips">
<!-- Senin: Aktif -->
<div class="day-chip flex flex-col items-center justify-center py-3 rounded-lg bg-primary-container text-white transition-all" data-day="sen">
<span class="font-label-sm text-label-sm font-semibold">Sen</span>
<span class="w-1.5 h-1.5 rounded-full bg-white mt-1.5"></span>
</div>
<!-- Selasa: Aktif -->
<div class="day-chip flex flex-col items-center justify-center py-3 rounded-lg bg-primary-container text-white transition-all" data-day="sel">
<span class="font-label-sm text-label-sm font-semibold">Sel</span>
<span class="w-1.5 h-1.5 rounded-full bg-white mt-1.5"></span>
</div>
<!-- Rabu: Istirahat -->
<div class="day-chip flex flex-col items-center justify-center py-3 rounded-lg bg-surface-container-highest text-on-surface-variant transition-all" data-day="rab">
<span class="font-label-sm text-label-sm">Rab</span>
<span class="w-1.5 h-1.5 rounded-full bg-surface-variant mt-1.5"></span>
</div>
<!-- Kamis: Aktif -->
<div class="day-chip flex flex-col items-center justify-center py-3 rounded-lg bg-primary-container text-white transition-all" data-day="kam">
<span class="font-label-sm text-label-sm font-semibold">Kam</span>
<span class="w-1.5 h-1.5 rounded-full bg-white mt-1.5"></span>
</div>
<!-- Jumat: Istirahat -->
<div class="day-chip flex flex-col items-center justify-center py-3 rounded-lg bg-surface-container-highest text-on-surface-variant transition-all" data-day="jum">
<span class="font-label-sm text-label-sm">Jum</span>
<span class="w-1.5 h-1.5 rounded-full bg-surface-variant mt-1.5"></span>
</div>
<!-- Sabtu: Aktif -->
<div class="day-chip flex flex-col items-center justify-center py-3 rounded-lg bg-primary-container text-white transition-all" data-day="sab">
<span class="font-label-sm text-label-sm font-semibold">Sab</span>
<span class="w-1.5 h-1.5 rounded-full bg-white mt-1.5"></span>
</div>
<!-- Minggu: Istirahat -->
<div class="day-chip flex flex-col items-center justify-center py-3 rounded-lg bg-surface-container-highest text-on-surface-variant transition-all" data-day="min">
<span class="font-label-sm text-label-sm">Min</span>
<span class="w-1.5 h-1.5 rounded-full bg-surface-variant mt-1.5"></span>
</div>
</div>
<!-- Info note -->
<div class="mt-space-md flex items-center justify-between text-on-surface-variant font-label-sm text-label-sm">
<div class="flex items-center space-x-2">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span>Latihan</span>
</div>
<div class="flex items-center space-x-2">
<span class="w-2 h-2 rounded-full bg-surface-container-highest"></span>
<span>Istirahat</span>
</div>
</div>
</div>
<!-- Bottom CTA -->
<div class="mt-auto pt-space-xl">
<button class="w-full h-[52px] bg-primary-container text-white font-label-md text-body-lg rounded-2xl flex items-center justify-center shadow-lg active:scale-95 transition-all" type="button">
      Lanjut
    </button>
</div>
</div>
<script>
  (function () {
    const schedules = {
      3: { active: ['sen', 'rab', 'jum'], label: '3 hari aktif' },
      4: { active: ['sen', 'sel', 'kam', 'sab'], label: '4 hari aktif' },
      5: { active: ['sen', 'sel', 'rab', 'kam', 'jum'], label: '5 hari aktif' }
    };

    const freqButtons = document.querySelectorAll('.freq-btn');
    const dayChips = document.querySelectorAll('.day-chip');
    const countLabel = document.getElementById('active-count-label');

    freqButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const count = btn.getAttribute('data-days');

        freqButtons.forEach(b => {
          b.className = 'freq-btn flex flex-col items-center justify-center py-5 px-space-xs rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-95 transition-all';
          b.querySelector('span:first-child').className = 'font-stat-compact text-stat-compact text-on-surface leading-none';
          b.querySelector('span:last-child').className = 'font-label-md text-label-md text-on-surface-variant mt-1';
        });

        btn.className = 'freq-btn relative flex flex-col items-center justify-center py-5 px-space-xs rounded-xl bg-primary-container text-white shadow-lg active:scale-95 transition-all';
        btn.querySelector('span:first-child').className = 'font-stat-compact text-stat-compact text-white leading-none';
        btn.querySelector('span:last-child').className = 'font-label-md text-label-md text-white mt-1';

        const config = schedules[count];
        if (config) {
          countLabel.textContent = config.label;
          dayChips.forEach(chip => {
            const day = chip.getAttribute('data-day');
            const isActive = config.active.includes(day);
            const textSpan = chip.querySelector('span:first-child');
            const dotSpan = chip.querySelector('span:last-child');

            if (isActive) {
              chip.className = 'day-chip flex flex-col items-center justify-center py-3 rounded-lg bg-primary-container text-white transition-all';
              textSpan.className = 'font-label-sm text-label-sm font-semibold';
              dotSpan.className = 'w-1.5 h-1.5 rounded-full bg-white mt-1.5';
            } else {
              chip.className = 'day-chip flex flex-col items-center justify-center py-3 rounded-lg bg-surface-container-highest text-on-surface-variant transition-all';
              textSpan.className = 'font-label-sm text-label-sm';
              dotSpan.className = 'w-1.5 h-1.5 rounded-full bg-surface-variant mt-1.5';
            }
          });
        }
      });
    });
  })();
</script></main></body></html>
