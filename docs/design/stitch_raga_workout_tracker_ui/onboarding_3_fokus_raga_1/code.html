<script>
  function selectFocus(type) {
    const isLower = type === 'lower';
    
    const cardLower = document.getElementById('card-lower');
    const borderLower = document.getElementById('border-lower');
    const iconLower = document.getElementById('icon-box-lower');
    const titleLower = document.getElementById('title-lower');
    const subLower = document.getElementById('sub-lower');

    const cardUpper = document.getElementById('card-upper');
    const borderUpper = document.getElementById('border-upper');
    const iconUpper = document.getElementById('icon-box-upper');
    const titleUpper = document.getElementById('title-upper');
    const subUpper = document.getElementById('sub-upper');

    if (isLower) {
      cardLower.classList.add('shadow-[0_0_24px_rgba(255,90,44,0.12)]');
      borderLower.style.boxShadow = 'inset 0 0 0 1.5px #ff5a2c';
      iconLower.className = 'flex items-center justify-center w-12 h-12 rounded-xl shrink-0 transition-colors bg-primary-container/15 text-primary-container';
      titleLower.className = 'text-body-lg font-body-lg text-white';
      subLower.className = 'text-body-md font-body-md text-primary-container mt-0.5';

      cardUpper.classList.remove('shadow-[0_0_24px_rgba(255,90,44,0.12)]');
      borderUpper.style.boxShadow = 'inset 0 0 0 1px #232733';
      iconUpper.className = 'flex items-center justify-center w-12 h-12 rounded-xl shrink-0 transition-colors bg-surface-container-high text-on-surface-variant';
      titleUpper.className = 'text-body-lg font-body-lg text-on-surface';
      subUpper.className = 'text-body-md font-body-md text-on-surface-variant mt-0.5';
    } else {
      cardUpper.classList.add('shadow-[0_0_24px_rgba(255,90,44,0.12)]');
      borderUpper.style.boxShadow = 'inset 0 0 0 1.5px #ff5a2c';
      iconUpper.className = 'flex items-center justify-center w-12 h-12 rounded-xl shrink-0 transition-colors bg-primary-container/15 text-primary-container';
      titleUpper.className = 'text-body-lg font-body-lg text-white';
      subUpper.className = 'text-body-md font-body-md text-primary-container mt-0.5';

      cardLower.classList.remove('shadow-[0_0_24px_rgba(255,90,44,0.12)]');
      borderLower.style.boxShadow = 'inset 0 0 0 1px #232733';
      iconLower.className = 'flex items-center justify-center w-12 h-12 rounded-xl shrink-0 transition-colors bg-surface-container-high text-on-surface-variant';
      titleLower.className = 'text-body-lg font-body-lg text-on-surface';
      subLower.className = 'text-body-md font-body-md text-on-surface-variant mt-0.5';
    }
