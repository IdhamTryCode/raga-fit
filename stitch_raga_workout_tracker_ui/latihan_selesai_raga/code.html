<!DOCTYPE html><html class="dark" lang="id"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container-lowest": "#0c0e12", "tertiary": "#6fd2ff", "tertiary-fixed-dim": "#6fd2ff", "on-tertiary-container": "#002f40", "on-tertiary-fixed": "#001f2b", "on-primary-fixed-variant": "#881f00", "surface-dim": "#111317", "outline-variant": "#5b403a", "inverse-surface": "#e2e2e8", "surface-tint": "#ffb5a1", "primary": "#ffb5a1", "on-tertiary-fixed-variant": "#004d66", "secondary-container": "#00c16a", "on-secondary": "#00391b", "on-error-container": "#ffdad6", "primary-fixed-dim": "#ffb5a1", "secondary": "#41e185", "on-error": "#690005", "on-surface-variant": "#e4beb5", "surface-bright": "#37393e", "secondary-fixed-dim": "#41e185", "error-container": "#93000a", "secondary-fixed": "#64fe9f", "surface-container": "#1e2024", "on-background": "#e2e2e8", "surface": "#111317", "on-primary-container": "#571100", "tertiary-container": "#009ecd", "surface-container-high": "#282a2e", "error": "#ffb4ab", "primary-fixed": "#ffdbd1", "tertiary-fixed": "#c0e8ff", "inverse-on-surface": "#2f3035", "on-secondary-fixed-variant": "#00522a", "outline": "#ab8981", "surface-variant": "#333539", "inverse-primary": "#b22c00", "on-secondary-container": "#004824", "on-secondary-fixed": "#00210d", "primary-container": "#ff5a2c", "on-primary": "#601300", "on-tertiary": "#003547", "surface-container-highest": "#333539", "on-surface": "#e2e2e8", "on-primary-fixed": "#3b0800", "background": "#111317", "surface-container-low": "#1a1c20" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin": "1.25rem", "space-md": "0.75rem", "space-lg": "1rem", "space-xl": "1.5rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "gutter": "1rem" }, "fontFamily": { "headline-lg": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "stat-display": ["Plus Jakarta Sans"], "stat-compact": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"] }, "fontSize": { "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "stat-display": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.03em", "fontWeight": "800" }], "stat-compact": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full px-margin justify-between min-h-[640px] py-space-xl relative overflow-hidden select-none">
<!-- Subtle Ambient Glow -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-secondary/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Top & Center Hero Content Area -->
<div class="flex flex-col items-center justify-center flex-1 w-full text-center z-10 my-auto">
<!-- Celebratory Checkmark Icon -->
<div class="relative flex items-center justify-center mb-space-xl">
<!-- Outer Pulsing Aura -->
<div class="absolute w-28 h-28 rounded-full bg-secondary/15 animate-ping opacity-75"></div>
<!-- Middle Concentric Ring -->
<div class="absolute w-28 h-28 rounded-full bg-surface-container-high/60 flex items-center justify-center backdrop-blur-sm"></div>
<!-- Core Icon Circle with Glow -->
<div class="relative w-20 h-20 rounded-full bg-secondary-container flex items-center justify-center shadow-lg shadow-secondary/20 transition-transform duration-300 hover:scale-105 active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-on-secondary text-4xl" style="font-variation-settings: 'FILL' 1, 'wght' 700;">
          check
        </span>
</div>
</div>
<!-- Celebration Header & Routine Context -->
<div class="space-y-space-xs max-w-xs">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">
        Latihan selesai!
      </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant/80">
        Fokus Bokong &amp; Paha Belakang
      </p>
</div>
<!-- Stat Tiles (3-Column Balanced Grid) -->
<div class="grid grid-cols-3 gap-space-sm w-full mt-8">
<!-- Tile 1: Durasi -->
<div class="bg-surface-container-low rounded-xl p-space-md flex flex-col items-center justify-center text-center transition-all duration-200 hover:bg-surface-container">
<span class="material-symbols-outlined mb-1.5 text-xl text-secondary" style="font-variation-settings: &quot;FILL&quot; 1;">
          timer
        </span>
<span class="font-stat-compact text-stat-compact text-on-surface leading-tight">
          48<span class="text-sm font-label-sm text-on-surface-variant ml-0.5">mnt</span>
</span>
<span class="font-label-sm text-label-sm text-on-surface-variant/70 mt-1 uppercase tracking-wider">
          Durasi
        </span>
</div>
<!-- Tile 2: Total Set -->
<div class="bg-surface-container-low rounded-xl p-space-md flex flex-col items-center justify-center text-center transition-all duration-200 hover:bg-surface-container">
<span class="material-symbols-outlined mb-1.5 text-xl text-secondary" style="font-variation-settings: &quot;FILL&quot; 1;">
          layers
        </span>
<span class="font-stat-compact text-stat-compact text-on-surface leading-tight">
          18
        </span>
<span class="font-label-sm text-label-sm text-on-surface-variant/70 mt-1 uppercase tracking-wider">
          Total Set
        </span>
</div>
<!-- Tile 3: Total Beban -->
<div class="bg-surface-container-low rounded-xl p-space-md flex flex-col items-center justify-center text-center transition-all duration-200 hover:bg-surface-container">
<span class="material-symbols-outlined text-secondary mb-1.5 text-xl" style="font-variation-settings: 'FILL' 1;">
          fitness_center
        </span>
<span class="font-stat-compact text-stat-compact text-on-surface leading-tight">
          4.850<span class="text-sm font-label-sm text-on-surface-variant ml-0.5">kg</span>
</span>
<span class="font-label-sm text-label-sm text-on-surface-variant/70 mt-1 uppercase tracking-wider">
          Total Beban
        </span>
</div>
</div>
</div>
<!-- Bottom Action Section -->
<div class="w-full pt-space-lg pb-space-xs z-10">
<button class="w-full h-14 bg-primary-container text-white font-label-md text-body-lg rounded-2xl flex items-center justify-center shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-all duration-150" type="button">
      Kembali ke Jadwal
    </button>
</div>
</div></main>

</body></html>
